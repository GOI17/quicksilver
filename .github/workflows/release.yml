name: Validate and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Neovim
        run: brew install neovim
      - name: Test distribution
        run: python3 -m unittest discover -s tests -p 'distribution_spec.py' -v
      - name: Check launcher syntax
        run: bash -n bin/quicksilver

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Package release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/package-release.py "${RELEASE_TAG#v}" --output dist
      - name: Publish release and tap formula
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag --generate-notes --title "Quicksilver $RELEASE_TAG"
